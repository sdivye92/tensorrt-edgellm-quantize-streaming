[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streaming-quant"
version = "0.1.0"
description = "VRAM-constrained (streaming) quantization for TensorRT-Edge-LLM VLMs, via accelerate offload + ModelOpt layerwise calibration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # tensorrt-edgellm[tools] (installed separately -- see README) already
    # pulls torch==2.13.0, transformers==5.14.1, nvidia-modelopt==0.45.0,
    # safetensors, tqdm, etc. This project only adds what that extra doesn't
    # already pin.
    "accelerate>=1.10.1",
]

[project.scripts]
tensorrt-edgellm-quantize-streaming = "streaming_quant.cli:main"

[tool.setuptools.packages.find]
include = ["streaming_quant*"]
